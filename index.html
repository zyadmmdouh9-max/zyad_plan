<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gigs Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--card2:#f3f6f3;--tx:#11211a;--mu:#5f7168;--bd:#e0e7e1;--wa:#1faa59;--waD:#128c4a;--gold:#c48300;--goldBg:#fff6dc;--red:#d63a3a;--redBg:#fdecec;--blue:#1c6ed6;--blueBg:#e7f0ff;--org:#e8590c;--orgBg:#fff0e6;--ac:#075e54;--ink:#0b2e25;--sh:0 1px 2px rgba(16,40,28,.05),0 8px 28px rgba(16,40,28,.07);--r:20px}
[data-theme=dark]{--bg:#0a110e;--card:#121c18;--card2:#18251f;--tx:#e6f1eb;--mu:#8ea79b;--bd:#22332b;--goldBg:#2b2310;--redBg:#2d1616;--blueBg:#11203a;--orgBg:#2d1c10;--ac:#25d366;--ink:#06120e;--sh:none}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;padding-bottom:70px;transition:background .3s}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:28px 0 30px;background:#062e27}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(40% 40% at 20% 30%,#25d36655,transparent 70%),radial-gradient(35% 35% at 80% 20%,#128c7e88,transparent 70%),radial-gradient(30% 30% at 60% 90%,#c4830044,transparent 70%);filter:blur(10px)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(#000,transparent)}
.hero .wrap{position:relative;z-index:1}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#25d366,#128c7e);display:grid;place-items:center;flex:none;box-shadow:0 8px 24px #25d36655}
.logo svg{width:30px;height:30px;fill:#fff}
h1{font-size:27px;font-weight:900;line-height:1.25;letter-spacing:-.3px}
.sub{opacity:.8;font-size:14.5px}
.hbtns{margin-inline-start:auto;display:flex;gap:8px}
.thm{width:44px;height:44px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);cursor:pointer;font-size:18px;color:#fff;backdrop-filter:blur(6px)}
.count{margin-top:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px 18px;backdrop-filter:blur(8px)}
.count .big{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#b8f5d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.count .lab{font-size:13.5px;opacity:.85;line-height:1.4}
.count .lab b{display:block;font-size:16px;opacity:1}
.tbar{flex:1;min-width:220px}
.tbar .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.tbar .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#25d366,#ffd43b)}
.tbar .tl{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:5px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-58px;position:relative;z-index:2}
.kpi{background:var(--card);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);border:1px solid var(--bd);display:flex;align-items:center;gap:13px}
.kpi .si{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--card2)}
.kpi b{font-size:23px;font-weight:900;display:block;line-height:1.15}
.kpi span{color:var(--mu);font-size:12.5px}
.ring{--p:0;--c:var(--wa);width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::after{content:"";width:34px;height:34px;border-radius:50%;background:var(--card)}
.ring.lg{width:64px;height:64px}.ring.lg::after{width:48px;height:48px}
.ring em{position:absolute;font-style:normal;font-size:12px;font-weight:900}
/* tabs */
.tabs{display:flex;gap:6px;margin-top:16px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:6px;box-shadow:var(--sh);position:sticky;top:8px;z-index:30;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;white-space:nowrap;padding:10px 14px;border-radius:13px;border:0;background:transparent;cursor:pointer;font-weight:800;font-size:14px;color:var(--mu);transition:.18s}
.tab:hover{color:var(--tx);background:var(--card2)}
.tab.on{background:var(--ac);color:#fff;box-shadow:0 6px 16px #075e5440}
[data-theme=dark] .tab.on{color:#06281a}
.tab small{font-weight:700;opacity:.8}
.view{display:none;animation:fade .25s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* generic */
.sec{margin-top:20px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sh h2{font-size:19px;font-weight:900}
.sh p{color:var(--mu);font-size:13.5px}
.sh .sp{margin-inline-start:auto}
.box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.btn{padding:8px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:800;font-size:13px;white-space:nowrap;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--wa)}
.btn.pri{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.pri:hover{background:var(--waD)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
[data-theme=dark] .btn.dark{background:#25d366;color:#06281a;border-color:#25d366}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.chip{padding:5px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--wa)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
[data-theme=dark] .chip.on{color:#06281a}
.chip small{opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:10px}
.lbl{font-size:12.5px;font-weight:800;color:var(--mu);min-width:56px}
.tag{font-size:11.5px;padding:1px 9px;border-radius:7px;background:var(--card2);color:var(--mu);font-weight:700;white-space:nowrap}
.tag.g{background:var(--goldBg);color:var(--gold)}
.tag.today,.tag.low{background:var(--redBg);color:var(--red)}
.tag.ok{background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa)}
.tag.bl{background:var(--blueBg);color:var(--blue)}
.tag.or{background:var(--orgBg);color:var(--org)}
.hint{color:var(--mu);font-size:13px;background:var(--card2);border-radius:12px;padding:10px 12px}
.empty{text-align:center;color:var(--mu);padding:50px}
/* plan */
.goal{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.goal h3{font-size:18px;font-weight:900;line-height:1.4}
.goal p{color:var(--mu);font-size:13.5px}
.ms{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.m{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.m .n{width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:900;font-size:13px}
.m.done .n{background:var(--wa);color:#fff}
.m .t{font-weight:800;font-size:14px;line-height:1.35}
.m .t small{display:block;color:var(--mu);font-weight:700;font-size:12px}
.m .pr{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:5px}
.m .pr i{display:block;height:100%;background:var(--wa);border-radius:99px}
.m .v{font-weight:900;font-size:13px;color:var(--mu);white-space:nowrap}
.phases{display:flex;flex-direction:column;gap:14px;position:relative}
.ph{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ph.cur{border-color:var(--wa);box-shadow:0 0 0 3px color-mix(in srgb,var(--wa) 18%,transparent),var(--sh)}
.ph.past{opacity:.72}
.phh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.phh .num{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;flex:none}
.phh h3{font-size:16px;font-weight:900;line-height:1.3}
.phh p{color:var(--mu);font-size:12.5px}
.phh .st{margin-inline-start:auto;text-align:left}
.phb{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:13px;background:var(--card2)}
.it input{margin-top:5px;width:18px;height:18px;accent-color:var(--wa);flex:none;cursor:pointer}
.it .tx{flex:1;font-size:14px;font-weight:600;line-height:1.55}
.it.dn .tx{text-decoration:line-through;color:var(--mu)}
.it .tx .w{display:inline-block;font-size:11px;font-weight:800;padding:0 8px;border-radius:6px;margin-inline-end:6px;vertical-align:1px}
.w.j{background:var(--blueBg);color:var(--blue)}.w.k{background:var(--orgBg);color:var(--org)}.w.p{background:color-mix(in srgb,var(--wa) 14%,transparent);color:var(--wa)}.w.q{background:var(--goldBg);color:var(--gold)}
.it .dt{font-size:11.5px;color:var(--mu);font-weight:800;white-space:nowrap;margin-top:3px}
.ins{display:flex;flex-direction:column;gap:8px}
.in{display:flex;gap:10px;padding:10px 12px;border-radius:13px;background:var(--card2);font-size:13.5px;line-height:1.6}
.in b{font-weight:800}
.in .e{font-size:18px;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:800;font-size:12px}
td .g{direction:ltr;display:inline-block;font-weight:800}
.tw{overflow-x:auto}
/* funnel */
.fun{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:10px;padding:2px 4px}
.fr:hover{background:var(--card2)}
.fr .bar{height:24px;border-radius:8px;background:var(--card2);overflow:hidden}
.fr .bar i{display:block;height:100%;border-radius:8px;min-width:4px}
.fr b{font-weight:900;text-align:left}
.stk{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--card2);margin:10px 0}
.stk i{display:block;height:100%}
.gcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.gcard .top{display:flex;gap:12px;align-items:center}
.gcard h3{font-size:16px;font-weight:900;direction:ltr;text-align:right}
.gcard .cm{color:var(--mu);font-size:12.5px}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--mu);font-weight:700}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-inline-end:4px}
/* students */
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-top:14px;box-shadow:var(--sh)}
.camp{display:flex;gap:6px;background:var(--card2);border-radius:14px;padding:4px}
.camp button{flex:1;border:0;background:transparent;padding:8px 12px;border-radius:11px;font-weight:800;font-size:13px;cursor:pointer;color:var(--mu)}
.camp button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.srch{flex:1;min-width:200px;position:relative}
.srch input{width:100%;padding:9px 38px 9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);outline:0}
.srch input:focus{border-color:var(--wa);background:var(--card)}
.srch::before{content:"🔍";position:absolute;right:12px;top:8px;font-size:14px;opacity:.6}
label.tg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);cursor:pointer}
label.tg input{accent-color:var(--wa)}
.gsec{margin-top:22px}
.ghd{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ghd h2{font-size:17px;font-weight:900;direction:ltr}
.ghd .when{font-size:12.5px;font-weight:800;padding:3px 12px;border-radius:99px;background:var(--card2);color:var(--mu)}
.ghd .when.today{background:var(--redBg);color:var(--red)}
.ghd .cnt{color:var(--mu);font-size:13px;margin-inline-start:auto}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.stc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);transition:.2s;position:relative;border-inline-start:4px solid var(--sc,var(--bd))}
.stc:hover{transform:translateY(-2px)}
.stc.sent{opacity:.58}
.stc.grad{background:linear-gradient(160deg,var(--goldBg),var(--card) 55%)}
.who{display:flex;gap:11px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;flex:none;position:relative}
.av i{position:absolute;bottom:-3px;left:-3px;font-style:normal;font-size:13px;background:var(--card);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.nm{font-weight:800;font-size:15px;line-height:1.4}
.ph2{color:var(--mu);font-size:12.5px;direction:ltr;text-align:right}
.gb{display:flex;gap:3px;margin-inline-start:auto;align-self:flex-start;flex-direction:column;align-items:flex-end}
.gb .s{display:flex;gap:3px}
.gb .s i{width:16px;height:7px;border-radius:4px;background:var(--card2)}
.gb .s i.f{background:var(--org)}
.gb small{font-size:10.5px;color:var(--mu);font-weight:800}
.stc.grad .gb .s i{background:var(--gold)}
.meta{display:flex;gap:5px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mu);background:var(--card2);border-radius:10px;padding:5px 9px;line-height:1.5}
.acts{display:flex;gap:6px;align-items:center}
.wa{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:12px;background:var(--wa);color:#fff;font-weight:800;text-decoration:none;font-size:14px;white-space:nowrap;transition:.15s;border:0;cursor:pointer}
.wa:hover{background:var(--waD)}
.stc.sent .wa{background:var(--card2);color:var(--mu)}
.wa svg{width:18px;height:18px;fill:currentColor}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none;text-decoration:none}
.ic:hover{border-color:var(--wa)}
/* compose cards */
.cc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.cch{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--bd)}
.cch h3{font-size:15.5px;font-weight:900;line-height:1.3}
.cch p{color:var(--mu);font-size:12.5px}
.ccb{padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.ccb textarea{width:100%;min-height:230px;padding:12px;border-radius:14px;border:1px solid var(--bd);background:#e9f7ee;color:#111;outline:0;resize:vertical;line-height:1.75;font-size:13.5px}
[data-theme=dark] .ccb textarea{background:#0f2a22;color:#e9edef}
.ccf{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
/* modals */
.md{position:fixed;inset:0;background:rgba(5,20,12,.55);backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.md.on{display:flex}
.mb{background:var(--card);border-radius:22px;width:min(560px,100%);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mb.wide{width:min(780px,100%)}
.mb h3{display:flex;align-items:center;gap:8px;font-size:17px;padding:14px 18px;background:var(--ac);color:#fff}
[data-theme=dark] .mb h3{color:#06281a}
.mb h3 .x{margin-inline-start:auto;background:rgba(255,255,255,.2);border:0;color:inherit}
.chatbg{background:#e5ddd5;padding:18px;background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:14px 14px}
[data-theme=dark] .chatbg{background-color:#0b141a}
.pv{white-space:pre-wrap;background:#dcf8c6;color:#111;border-radius:12px 0 12px 12px;padding:10px 12px;font-size:14px;max-height:55vh;overflow:auto;box-shadow:0 1px 1px rgba(0,0,0,.1);margin-inline-start:auto;max-width:92%;word-break:break-word}
[data-theme=dark] .pv{background:#005c4b;color:#e9edef}
.mb .foot{padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap}
.mb .bd{padding:14px 18px}
.mb label{display:block;font-weight:800;margin:12px 0 4px;font-size:14px}
.mb label small{color:var(--mu);font-weight:600}
.mb textarea{width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);outline:0;resize:vertical;line-height:1.7}
.mb h4{margin:18px 0 2px;font-size:14px;font-weight:900;color:var(--ac);border-top:1px dashed var(--bd);padding-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--card);font-weight:800;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv span{color:var(--mu);font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#075e54;color:#fff;padding:10px 22px;border-radius:99px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1}
@media(max-width:760px){h1{font-size:21px}.count .big{font-size:36px}.list,.grid3{grid-template-columns:1fr}.fr{grid-template-columns:120px 1fr 36px}.tab{flex:none}#gChips,#fChips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}}
@media print{.tabs,.hero .hbtns,.btn,.panel{display:none!important}.view{display:block!important}}

.lng{width:auto;padding:0 14px;font-weight:900;font-size:14px}
[dir=ltr] .srch input{padding:9px 12px 9px 38px}[dir=ltr] .srch::before{right:auto;left:12px}
[dir=ltr] .ph2{text-align:left}[dir=ltr] .phh .st{text-align:right}[dir=ltr] .fr b{text-align:right}
[dir=ltr] th,[dir=ltr] td{text-align:left}[dir=ltr] .gcard h3{text-align:left}
.it .go{flex:none}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="hd">

 <div class="ccb"><div class="row">${CLABELS.map(l=>`<button class="chip ${k===l[0]?'on':''}" data-cs="${g}" data-k="${l[0]}">${l[1]}</button>`).join('')}</div><textarea data-ct="${g}" dir="rtl">${esc(t)}</textarea></div>
 <div class="ccf"><button class="btn pri" data-csend="${g}" ${ok?'':'disabled style="opacity:.5"'}>${WA_IC.replace('<svg','<svg style="width:16px;height:16px;fill:currentColor"')} ${T('ابعت للكوتش','Send to coach')}</button><button class="btn" data-cc="${g}">${T('📋 انسخ','📋 Copy')}</button><button class="btn sm" data-creset="${g}">↺</button></div></div>`}).join('');
 const C=[...DATA.sup.map(x=>({...x,r:T('المشرفة','Supervisor'),i:'⭐'})),...DATA.qa.map(x=>({...x,r:T('فريق الجودة','QA team'),i:'🔍'}))];
 $('#contacts').innerHTML=C.map(x=>`<div class="in" style="align-items:center;background:var(--card);border:1px solid var(--bd)"><span class="e">${x.i}</span><div style="flex:1"><b>${esc(x.n)}</b><div style="font-size:12px;color:var(--mu)">${x.r} · <span dir="ltr">${esc(x.ph)}</span></div></div><a class="btn sm pri" target="_blank" rel="noopener" href="https://wa.me/${waNum(x.ph)}">WhatsApp</a></div>`).join('')}

/* ---------- template editor ---------- */
let ED=null;
function openEditor(kind){ED=kind;let labels,obj,hint;
 if(kind==='s'){labels=TPL_LABELS;obj=TPL;hint=T('المتغيرات','Variables')+': <b>{name}</b> <b>{day}</b> <b>{time}</b> <b>{link}</b> <b>{gigs}</b> <b>{left}</b> <b>{links}</b> <b>{done}</b> <b>{nc}</b> <b>{fix}</b> <b>{att}</b> <b>{profile}</b> <b>{ga}</b> <b>{svc}</b> <b>{daysLeft}</b> <b>{endDate}</b> <b>{outlier}</b> <b>{guide}</b>'}
 else{labels=kind==='g'?GLABELS:CLABELS;obj=kind==='g'?GT:CT;hint=T('المتغيرات','Variables')+': <b>{group}</b> <b>{coach}</b> <b>{daysLeft}</b> <b>{endDate}</b> <b>{grad}</b> <b>{total}</b> <b>{gradNames}</b> <b>{gradList}</b> <b>{left}</b> <b>{gradLine}</b> <b>{nextSes}</b> <b>{sesList}</b> <b>{link}</b> <b>{guide}</b> <b>{inGigs}</b> <b>{svDone}</b> <b>{pend}</b> <b>{fix}</b> <b>{none}</b> <b>{near}</b> <b>{list_done}</b> <b>{list_fix}</b> <b>{list_none}</b>'}
 $('#tplT').textContent=kind==='s'?T('✏️ رسايل الطلبة','✏️ Student messages'):kind==='g'?T('✏️ رسايل الجروبات','✏️ Group messages'):T('✏️ رسايل الكوتشز','✏️ Coach messages');
 $('#tplH').innerHTML=hint+' — '+T('التعديلات بتتحفظ على المتصفح ده.','changes are saved in this browser.');
 $('#tplF').innerHTML=labels.map(l=>l[0]==='#'?`<h4>${l[1]}</h4>`:`<label>${l[1]}</label><textarea data-k="${l[0]}" dir="rtl">${esc(obj[l[0]])}</textarea>`).join('');
 $('#tplM').classList.add('on')}
$('#tplSave').onclick=()=>{const obj=ED==='s'?TPL:ED==='g'?GT:CT;$$('#tplF [data-k]').forEach(t=>obj[t.dataset.k]=t.value);store.set(ED==='s'?'wa-tpl':ED==='g'?'gtpl':'ctpl',obj);
 if(ED!=='s'){for(const k in gTxt)delete gTxt[k];for(const k in cgTxt)delete cgTxt[k];for(const k in cTxt)delete cTxt[k]}$('#tplM').classList.remove('on');renderAll();toast(T('اتحفظت ✓','Saved ✓'))};
$('#tplReset').onclick=()=>{if(ED==='s'){TPL=Object.assign({},DEF);store.set('wa-tpl',{})}else if(ED==='g'){GT=Object.assign({},GDEF);store.set('gtpl',{})}else{CT=Object.assign({},CDEF);store.set('ctpl',{})}openEditor(ED);renderAll();toast(T('رجعت للأصل','Restored'))};

/* ---------- CSV ---------- */
function exportCSV(){const H=['ID','Name (AR)','Name (EN)','Phone','Group','Stage','Gigs','Services','Links uploaded','Links accepted','QA notes','Attendance','Outlier','Last contact','Note','Sent (status)','Sent (deadline)'];
 const S1=store.get('wa-sent',{}),S2=store.get('wa-sent-deadline',{}),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 const rows=DATA.st.slice().sort((a,b)=>a.g<b.g?-1:a.g>b.g?1:prio(a)-prio(b)).map(s=>{const e=E(s);return [s.id,s.ar,s.en,s.ph,s.g,SL(e.stage),e.g+'/3',s.sv,s.lk,s.dn,(s.fx||[]).join(' | '),s.att+'%',e.o?'✓':'',e.r?RLt(e.r):'',e.n,S1[s.id]?'✓':'',S2[s.id]?'✓':''].map(q).join(',')});
 const b=new Blob(['﻿'+[H.map(q).join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`gigs-plan-${TODAY}.csv`;a.click()}

/* ---------- tabs & events ---------- */
let TAB=store.get('tab','plan');
function setTab(t,scroll=true){TAB=t;store.set('tab',t);$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));if(scroll)window.scrollTo({top:$('#tabs').offsetTop-8,behavior:'smooth'})}
function renderAll(){header();plan();dash();renderStudents();renderCongrats();renderGroups();renderCoaches()}
function go(el){const t=el.dataset.go,st=el.dataset.stage||'',pre=el.dataset.pre||'';
 if(t==='csv'){exportCSV();return}
 if(t==='students'){fS=st||'all';fG=el.dataset.g||'all';if(pre&&pre!==CAMP){CAMP=pre;store.set('camp',CAMP);SENT=store.get(SENTK[CAMP],{});header()}renderStudents()}
 if(t==='coaches'&&pre){GIDS.forEach(g=>cSel[g]=pre);renderCoaches()}
 setTab(t)}
document.addEventListener('click',e=>{const Tg=e.target;
 const tb=Tg.closest('.tab');if(tb){setTab(tb.dataset.tab);return}
 const g=Tg.closest('[data-go]');if(g){go(g);return}
 const w=Tg.closest('[data-wa]');if(w){const id=w.dataset.wa;setTimeout(()=>{mark(id,true);renderAll()},300);return}
 const tg=Tg.closest('[data-tg]');if(tg){mark(tg.dataset.tg,!SENT[tg.dataset.tg]);renderAll();return}
 const fu=Tg.closest('[data-fu]');if(fu){openFU(fu.dataset.fu);return}
 const p=Tg.closest('[data-pv]');if(p){const s=byId(p.dataset.pv);$('#pvT').textContent='💬 '+nm3(s);$('#pvB').textContent=msg(s);$('#pvWa').href=waLink(s);$('#pvWa').dataset.id=s.id;$('#pvM').classList.add('on');return}
 const ed=Tg.closest('[data-edit]');if(ed){openEditor(ed.dataset.edit);return}
 const gs=Tg.closest('[data-gs]');if(gs){gSel[gs.dataset.gs]=gs.dataset.k;renderGroups();return}
 const cs=Tg.closest('[data-cs]');if(cs){cSel[cs.dataset.cs]=cs.dataset.k;renderCoaches();return}
 const gc=Tg.closest('[data-gcopy],[data-gc]');if(gc){const g=gc.dataset.gcopy||gc.dataset.gc,t=$(`[data-gt="${g}"]`).value;copy(t).then(()=>toast(T('اتنسخت ✓ — الصقها في الجروب','Copied ✓ — paste it in the group')),()=>toast(T('انسخها يدوي','Copy it manually')));if(gc.dataset.gcopy)window.open(DATA.groups[g].wa,'_blank');return}
 const cg=Tg.closest('[data-cgcopy],[data-cgc]');if(cg){const g=cg.dataset.cgcopy||cg.dataset.cgc,t=$(`[data-cgt="${g}"]`).value;copy(t).then(()=>toast(T('اتنسخت ✓ — الصقها في الجروب','Copied ✓ — paste it in the group')),()=>toast(T('انسخها يدوي','Copy it manually')));if(cg.dataset.cgcopy)window.open(DATA.groups[g].wa,'_blank');return}
 const cgr=Tg.closest('[data-cgreset]');if(cgr){delete cgTxt[cgr.dataset.cgreset];renderCongrats();return}
 const gr=Tg.closest('[data-greset]');if(gr){const g=gr.dataset.greset;delete gTxt[g+(gSel[g]||'kick')];renderGroups();return}
 const cr=Tg.closest('[data-creset]');if(cr){const g=cr.dataset.creset;delete cTxt[g+(cSel[g]||'brief')];renderCoaches();return}
 const csd=Tg.closest('[data-csend]');if(csd){const g=csd.dataset.csend;window.open(waTo(DATA.groups[g].cph,$(`[data-ct="${g}"]`).value),'_blank');return}
 const cc=Tg.closest('[data-cc]');if(cc){copy($(`[data-ct="${cc.dataset.cc}"]`).value).then(()=>toast(T('اتنسخت ✓','Copied ✓')),()=>toast(T('انسخها يدوي','Copy it manually')));return}
 if(Tg.closest('[data-close]')||Tg.classList.contains('md'))$$('.md').forEach(m=>m.classList.remove('on'))});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.cgt){cgTxt[t.dataset.cgt]=t.value}
 if(t.dataset.gt){const g=t.dataset.gt;gTxt[g+(gSel[g]||'kick')]=t.value}
 if(t.dataset.ct){const g=t.dataset.ct;cTxt[g+(cSel[g]||'brief')]=t.value}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.plan){PLAN[t.dataset.plan]=t.checked;store.set('plan-done',PLAN);plan()}
 if(t.dataset.daily){const k='daily-'+TODAY,D=store.get(k,{});D[t.dataset.daily]=t.checked;store.set(k,D);plan()}});
$$('#camp button').forEach(b=>b.onclick=()=>{CAMP=b.dataset.c;store.set('camp',CAMP);SENT=store.get(SENTK[CAMP],{});renderAll()});
$('#nextBtn').onclick=()=>{const s=filtered().find(x=>!SENT[x.id]);if(!s){toast(T('خلصت كل اللي في الفلتر ده 🎉','Everyone in this filter is done 🎉'));return}window.open(waLink(s),'_blank');mark(s.id,true);renderAll();toast(T('اتفتح: ','Opened: ')+nm3(s))};
$('#pvWa').onclick=()=>{const id=$('#pvWa').dataset.id;setTimeout(()=>{mark(id,true);renderAll()},300)};
$('#pvCp').onclick=()=>copy($('#pvB').textContent).then(()=>toast(T('اتنسخت ✓','Copied ✓')),()=>toast(T('انسخها يدوي','Copy it manually')));
$('#q').oninput=()=>renderStudents();$('#hideSent').onchange=()=>renderStudents();
$('#tplBtn').onclick=()=>openEditor('s');
$('#csvBtn').onclick=exportCSV;
$('#resetSent').onclick=()=>{if(confirm(T('تصفّر علامات الإرسال للرسالة دي لكل الطلبة؟','Reset sent marks for this message for all students?'))){SENT={};store.set(SENTK[CAMP],SENT);renderAll()}};
addEventListener('keydown',e=>{if(e.key==='Escape')$$('.md').forEach(m=>m.classList.remove('on'))});
$('#lng').onclick=()=>{store.set('lang',EN?'ar':'en');location.reload()};
let TH=store.get('wa-theme','light');function applyTh(){document.documentElement.dataset.theme=TH;$('#thm').textContent=TH==='dark'?'☀️':'🌙'}
$('#thm').onclick=()=>{TH=TH==='dark'?'light':'dark';store.set('wa-theme',TH);applyTh()};applyTh();
renderAll();setTab(TAB,false);
</script>
</body>
